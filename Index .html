<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FitTools Mini App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 font-sans">
  <main class="max-w-md mx-auto space-y-6" id="main-content">
    <header class="text-center">
      <h1 class="text-2xl font-bold text-emerald-400">⚡ FitTools Mini App</h1>
      <p class="text-xs text-slate-400">Nutrición y Entrenamiento Rápido</p>
    </header>

    <!-- Calculadora de macros -->
    <section class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg space-y-4" aria-labelledby="macros-title">
      <h2 id="macros-title" class="text-lg font-semibold text-emerald-300">📊 Calculadora de Macros</h2>

      <form id="formMacros" class="grid grid-cols-2 gap-3" novalidate>
        <div>
          <label for="peso" class="block text-xs text-slate-400 mb-1">Peso (kg)</label>
          <input id="peso" name="peso" type="number" inputmode="decimal" min="1" step="0.1" placeholder="Ej: 75"
                 value="75"
                 aria-describedby="pesoHelp pesoError"
                 class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-emerald-500">
          <p id="pesoHelp" class="text-[11px] text-slate-500 mt-1">Introduce tu peso corporal en kilogramos.</p>
          <p id="pesoError" class="text-xs text-rose-400 mt-1 sr-only" role="alert"></p>
        </div>

        <div>
          <label for="objetivo" class="block text-xs text-slate-400 mb-1">Objetivo</label>
          <select id="objetivo" name="objetivo"
                  class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-emerald-500"
                  aria-label="Objetivo">
            <option value="volumen">Volumen (+)</option>
            <option value="mantenimiento" selected>Mantenimiento</option>
            <option value="definicion">Definición (-)</option>
          </select>
        </div>

        <div class="col-span-2">
          <button id="btnCalcular" type="submit"
                  class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2 rounded-lg text-sm transition">
            Calcular Dieta
          </button>
        </div>
      </form>

      <div id="resultadoMacros" class="hidden grid grid-cols-3 gap-2 text-center pt-2 border-t border-slate-700"
           aria-live="polite" aria-atomic="true">
        <div class="bg-slate-900 p-2 rounded">
          <p class="text-xs text-slate-400">Proteína</p>
          <p id="prot" class="font-bold text-emerald-400 text-sm">0 g</p>
        </div>
        <div class="bg-slate-900 p-2 rounded">
          <p class="text-xs text-slate-400">Carbohidratos</p>
          <p id="carbs" class="font-bold text-amber-400 text-sm">0 g</p>
        </div>
        <div class="bg-slate-900 p-2 rounded">
          <p class="text-xs text-slate-400">Grasas</p>
          <p id="fat" class="font-bold text-rose-400 text-sm">0 g</p>
        </div>

        <div class="col-span-3 mt-2 bg-slate-900 p-2 rounded flex items-center justify-between">
          <p class="text-xs text-slate-400">Calorías estimadas</p>
          <p id="kcal" class="font-bold text-emerald-300 text-sm">0 kcal</p>
        </div>

        <div class="col-span-3 flex gap-2 mt-2">
          <button id="copyMacros" class="flex-1 bg-slate-700 hover:bg-slate-600 text-emerald-300 font-semibold py-1 rounded text-sm">
            Copiar resultado
          </button>
          <button id="downloadMacros" class="flex-1 bg-slate-700 hover:bg-slate-600 text-emerald-300 font-semibold py-1 rounded text-sm">
            Descargar JSON
          </button>
        </div>
      </div>
    </section>

    <!-- Series de calentamiento -->
    <section class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg space-y-4" aria-labelledby="warmup-title">
      <h2 id="warmup-title" class="text-lg font-semibold text-emerald-300">🏋️ Series de Aproximación</h2>

      <form id="formWarmup" novalidate>
        <div>
          <label for="pesoEfectivo" class="block text-xs text-slate-400 mb-1">Peso de trabajo efectivo (kg)</label>
          <input id="pesoEfectivo" name="pesoEfectivo" type="number" inputmode="decimal" min="1" step="0.5" placeholder="Ej: 100"
                 class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-white focus:outline-none focus:border-emerald-500"
                 aria-describedby="pesoEfectivoError">
          <p id="pesoEfectivoError" class="text-xs text-rose-400 mt-1 sr-only" role="alert"></p>
        </div>

        <div>
          <button id="btnWarmup" type="submit"
                  class="w-full bg-slate-700 hover:bg-slate-600 text-emerald-400 font-bold py-2 rounded-lg text-sm border border-emerald-500/30 transition">
            Generar Calentamiento
          </button>
        </div>
      </form>

      <div id="resultadoWarmup" class="hidden space-y-1 pt-2 border-t border-slate-700 text-xs" aria-live="polite">
        <p class="text-slate-400 font-semibold mb-1">Realiza antes de tus series efectivas:</p>
        <div id="listaWarmup" class="space-y-1"></div>
      </div>
    </section>
  </main>

  <script>
    // Utilidades
    const fmt = (n) => n.toLocaleString('es-ES');

    // MACROS
    const formMacros = document.getElementById('formMacros');
    const pesoInput = document.getElementById('peso');
    const objetivoSelect = document.getElementById('objetivo');
    const resultadoMacros = document.getElementById('resultadoMacros');
    const protEl = document.getElementById('prot');
    const carbsEl = document.getElementById('carbs');
    const fatEl = document.getElementById('fat');
    const kcalEl = document.getElementById('kcal');
    const pesoError = document.getElementById('pesoError');
    const copyBtn = document.getElementById('copyMacros');
    const downloadBtn = document.getElementById('downloadMacros');

    function validarPeso(p) {
      if (Number.isNaN(p) || p <= 0) {
        return 'Introduce un peso válido mayor que 0';
      }
      if (p > 500) {
        return '¿Estás seguro/a? Peso demasiado alto';
      }
      return '';
    }

    formMacros.addEventListener('submit', (e) => {
      e.preventDefault();
      const peso = parseFloat(pesoInput.value);
      const err = validarPeso(peso);
      if (err) {
        pesoError.textContent = err;
        pesoError.classList.remove('sr-only');
        pesoInput.setAttribute('aria-invalid', 'true');
        return;
      } else {
        pesoError.textContent = '';
        pesoError.classList.add('sr-only');
        pesoInput.removeAttribute('aria-invalid');
      }

      const objetivo = objetivoSelect.value;
      let protGrams, fatGrams, carbsGrams;

      if (objetivo === 'volumen') {
        protGrams = peso * 2.0;
        fatGrams = peso * 1.0;
        carbsGrams = peso * 4.5;
      } else if (objetivo === 'definicion') {
        protGrams = peso * 2.2;
        fatGrams = peso * 0.8;
        carbsGrams = peso * 2.5;
      } else {
        protGrams = peso * 1.8;
        fatGrams = peso * 0.9;
        carbsGrams = peso * 3.5;
      }

      // Redondeo razonable
      protGrams = Math.round(protGrams);
      fatGrams = Math.round(fatGrams);
      carbsGrams = Math.round(carbsGrams);

      const kcal = Math.round(protGrams * 4 + carbsGrams * 4 + fatGrams * 9);

      protEl.innerText = fmt(protGrams) + ' g';
      carbsEl.innerText = fmt(carbsGrams) + ' g';
      fatEl.innerText = fmt(fatGrams) + ' g';
      kcalEl.innerText = fmt(kcal) + ' kcal';

      resultadoMacros.classList.remove('hidden');
      resultadoMacros.focus?.();
    });

    copyBtn.addEventListener('click', async () => {
      const payload = {
        proteina_g: protEl.innerText,
        carbohidratos_g: carbsEl.innerText,
        grasas_g: fatEl.innerText,
        calorias: kcalEl.innerText,
      };
      const text = `Macros: Proteína ${payload.proteina_g}, Carbohidratos ${payload.carbohidratos_g}, Grasas ${payload.grasas_g} — ${payload.calorias}`;
      try {
        await navigator.clipboard.writeText(text);
        copyBtn.textContent = 'Copiado ✓';
        setTimeout(() => (copyBtn.textContent = 'Copiar resultado'), 1400);
      } catch (err) {
        copyBtn.textContent = 'No se pudo copiar';
        setTimeout(() => (copyBtn.textContent = 'Copiar resultado'), 1400);
      }
    });

    downloadBtn.addEventListener('click', () => {
      const data = {
        peso: pesoInput.value,
        objetivo: objetivoSelect.value,
        proteina_g: protEl.innerText,
        carbohidratos_g: carbsEl.innerText,
        grasas_g: fatEl.innerText,
        calorias: kcalEl.innerText,
        generado_en: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'fittools_macros.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    });

    // WARMUP
    const formWarmup = document.getElementById('formWarmup');
    const pesoEfectivoInput = document.getElementById('pesoEfectivo');
    const listaWarmup = document.getElementById('listaWarmup');
    const resultadoWarmup = document.getElementById('resultadoWarmup');
    const pesoEfectivoError = document.getElementById('pesoEfectivoError');

    function validarPesoEfectivo(p) {
      if (Number.isNaN(p) || p <= 0) return 'Introduce un peso de trabajo válido mayor que 0';
      if (p > 1000) return '¿Seguro? Peso de trabajo demasiado alto';
      return '';
    }

    formWarmup.addEventListener('submit', (e) => {
      e.preventDefault();
      const target = parseFloat(pesoEfectivoInput.value);
      const err = validarPesoEfectivo(target);
      if (err) {
        pesoEfectivoError.textContent = err;
        pesoEfectivoError.classList.remove('sr-only');
        pesoEfectivoInput.setAttribute('aria-invalid', 'true');
        return;
      } else {
        pesoEfectivoError.textContent = '';
        pesoEfectivoError.classList.add('sr-only');
        pesoEfectivoInput.removeAttribute('aria-invalid');
      }

      // Fórmulas de aproximación; usa Math.round para pesos de barra más realistas
      const set1 = Math.round(target * 0.40 / 0.5) * 0.5;
      const set2 = Math.round(target * 0.60 / 0.5) * 0.5;
      const set3 = Math.round(target * 0.80 / 0.5) * 0.5;

      listaWarmup.innerHTML = `
        <div class="flex justify-between bg-slate-900 p-2 rounded"><span>Serie 1 (Calentamiento)</span><span class="font-bold text-emerald-400">${fmt(set1)} kg × 10 rep</span></div>
        <div class="flex justify-between bg-slate-900 p-2 rounded"><span>Serie 2 (Aproximación)</span><span class="font-bold text-emerald-400">${fmt(set2)} kg × 5 rep</span></div>
        <div class="flex justify-between bg-slate-900 p-2 rounded"><span>Serie 3 (Cerca del peso)</span><span class="font-bold text-emerald-400">${fmt(set3)} kg × 2 rep</span></div>
      `;
      resultadoWarmup.classList.remove('hidden');
    });

    // Mejora UX: submit con Enter en inputs ejecuta la acción correspondiente (ya cubierto por forms)
    // Enfocar el primer input al cargar
    window.addEventListener('DOMContentLoaded', () => {
      pesoInput.focus();
    });
  </script>
</body>
</html>
