<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10b981" />
    <title>FitTools Pro Mini App</title>
    <link rel="manifest" href="/manifest.json" />
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --primary: #10b981;
            --primary-hover: #059669;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        [data-theme="cyberpunk"] {
            --bg-color: #09090b;
            --card-bg: #18181b;
            --primary: #f43f5e;
            --primary-hover: #e11d48;
            --text-color: #fafafa;
            --text-muted: #a1a1aa;
            --border-color: #27272a;
        }

        [data-theme="monochrome"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #e5e5e5;
            --primary-hover: #ffffff;
            --text-color: #ffffff;
            --text-muted: #888888;
            --border-color: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg-color); color: var(--text-color); padding: 15px; padding-bottom: 40px; }
        .container { max-width: 600px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 20px; position: relative; }
        h1 { color: var(--primary); font-size: 1.6rem; }

        .theme-select { position: absolute; right: 0; top: 0; background: var(--card-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 4px 8px; border-radius: 6px; }

        nav { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 5px; }
        nav button { background: var(--card-bg); color: var(--text-muted); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 20px; white-space: nowrap; cursor: pointer; }
        nav button.active { background: var(--primary); color: #000; font-weight: bold; border-color: var(--primary); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card { background: var(--card-bg); border-radius: 12px; padding: 16px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        .card h2 { font-size: 1.1rem; margin-bottom: 12px; color: var(--primary); display: flex; justify-content: space-between; align-items: center; }

        label { display: block; font-size: 0.85rem; color: var(--text-muted); margin: 8px 0 4px; }
        input, select { width: 100%; padding: 10px; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); border-radius: 8px; outline: none; }

        button.btn-main { width: 100%; background: var(--primary); color: #000; font-weight: bold; border: none; padding: 12px; border-radius: 8px; margin-top: 12px; cursor: pointer; }
        button.btn-secondary { background: transparent; color: var(--primary); border: 1px solid var(--primary); width: 100%; padding: 8px; border-radius: 8px; margin-top: 8px; cursor: pointer; }

        .result-box { margin-top: 12px; padding: 10px; background: var(--bg-color); border-radius: 8px; font-size: 0.9rem; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        /* Timer Styles */
        .timer-display { font-size: 2.5rem; text-align: center; font-weight: bold; color: var(--primary); margin: 10px 0; }
        .timer-btns { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; }
        .timer-btns button { padding: 6px 12px; background: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 6px; }

        /* Table */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        th, td { padding: 8px; text-align: center; border-bottom: 1px solid var(--border-color); }
        th { color: var(--text-muted); }

        .pro-badge { background: #eab308; color: #000; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .locked { opacity: 0.5; pointer-events: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>⚡ FitTools Pro</h1>
        <select class="theme-select" aria-label="Seleccionar tema" onchange="changeTheme(this.value)">
            <option value="default">Emerald</option>
            <option value="cyberpunk">Cyberpunk</option>
            <option value="monochrome">Monochrome</option>
        </select>
    </header>

    <nav role="tablist" aria-label="Pestañas principales">
        <button class="active" role="tab" aria-selected="true" onclick="switchTab(event,'tab-macros')">Macros</button>
        <button role="tab" aria-selected="false" onclick="switchTab(event,'tab-1rm')">1RM &amp; RPE</button>
        <button role="tab" aria-selected="false" onclick="switchTab(event,'tab-timer')">Timer</button>
        <button role="tab" aria-selected="false" onclick="switchTab(event,'tab-agua')">Agua</button>
        <button role="tab" aria-selected="false" onclick="switchTab(event,'tab-pro')">Pro 👑</button>
    </nav>

    <!-- TAB 1: MACROS -->
    <div id="tab-macros" class="tab-content active" role="tabpanel" aria-hidden="false">
        <div class="card">
            <h2>Calculadora TDEE &amp; Macros</h2>
            <div class="grid-2">
                <div>
                    <label for="weight">Peso (kg)</label>
                    <input type="number" id="weight" placeholder="70" inputmode="decimal" />
                </div>
                <div>
                    <label for="height">Altura (cm)</label>
                    <input type="number" id="height" placeholder="175" inputmode="numeric" />
                </div>
            </div>
            <div class="grid-2">
                <div>
                    <label for="age">Edad</label>
                    <input type="number" id="age" placeholder="25" inputmode="numeric" />
                </div>
                <div>
                    <label for="goal">Objetivo</label>
                    <select id="goal">
                        <option value="deficit">Deficit (-20%)</option>
                        <option value="mant" selected>Mantenimiento</option>
                        <option value="volume">Volumen (+15%)</option>
                    </select>
                </div>
            </div>
            <button class="btn-main" onclick="calcMacros()">Calcular Dieta</button>
            <div id="macro-results" class="result-box" style="display:none;"></div>
            <button id="share-macro" class="btn-secondary" style="display:none;" onclick="shareResults()">Compartir por WhatsApp</button>
        </div>
    </div>

    <!-- TAB 2: 1RM & RPE -->
    <div id="tab-1rm" class="tab-content" role="tabpanel" aria-hidden="true">
        <div class="card">
            <h2>Calculadora de 1RM</h2>
            <div class="grid-2">
                <div>
                    <label for="rm-weight">Peso levantado (kg)</label>
                    <input type="number" id="rm-weight" placeholder="100" />
                </div>
                <div>
                    <label for="rm-reps">Repeticiones</label>
                    <input type="number" id="rm-reps" placeholder="5" />
                </div>
            </div>
            <button class="btn-main" onclick="calc1RM()">Calcular 1RM</button>
            <div id="rm-result" class="result-box" style="display:none;"></div>
        </div>
    </div>

    <!-- TAB 3: TIMER -->
    <div id="tab-timer" class="tab-content" role="tabpanel" aria-hidden="true">
        <div class="card">
            <h2>Temporizador de Descanso</h2>
            <div class="timer-display" id="timer-display">01:30</div>
            <div class="timer-btns">
                <button onclick="setTimer(30)">30s</button>
                <button onclick="setTimer(60)">60s</button>
                <button onclick="setTimer(90)">90s</button>
                <button onclick="setTimer(180)">3 min</button>
            </div>
            <div class="grid-2">
                <button class="btn-main" onclick="startTimer()">Iniciar</button>
                <button class="btn-secondary" onclick="resetTimer()">Reset</button>
            </div>
        </div>
    </div>

    <!-- TAB 4: TRACKER AGUA -->
    <div id="tab-agua" class="tab-content" role="tabpanel" aria-hidden="true">
        <div class="card">
            <h2>Registro de Agua Diaria</h2>
            <p style="text-align:center; margin:10px 0;">Consumido: <b id="water-count" style="color:var(--primary)">0</b> / 2500 ml</p>
            <div class="grid-2">
                <button class="btn-main" onclick="addWater(250)">+ 250 ml</button>
                <button class="btn-main" onclick="addWater(500)">+ 500 ml</button>
            </div>
            <button class="btn-secondary" onclick="resetWater()">Reiniciar Día</button>
        </div>
    </div>

    <!-- TAB 5: MONETIZACIÓN / PRO -->
    <*
